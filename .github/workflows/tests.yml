name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests (no network, no DB)
        env:
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: sqlite:///./test.db
          # core.openai_client builds an AsyncOpenAI client at import time, which
          # requires a key to exist. These unit tests never call the API — this
          # is a placeholder so module import (and test collection) succeeds.
          OPENAI_API_KEY: sk-test-not-used-in-unit-tests
        run: |
          pytest tests/test_normalization.py \
                 tests/test_categories.py \
                 tests/test_extraction_helpers.py \
                 tests/test_quantity_integrity.py \
                 tests/test_backfill_idempotence.py \
                 -v --tb=short
